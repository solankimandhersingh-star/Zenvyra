server:
  port: 8080

spring:
  application:
    name: ZENVYRA-API-GATEWAY

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:

            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

            - id: organization-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/organizations/**

            - id: customer-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/customers/**

            - id: Product-service
              uri: http://localhost:8084
              predicates:
                Path=/api/products/**

            - id: invoice-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/invoices/**

management:
  endpoint:
    gateway:
      access: read-only

  endpoints:
    web:
      exposure:
        include: health,info,gateway